{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
    	<meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login.com</title>
        <link rel="shortcut icon" href="" type="logo">
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" media="screen" >
        <link rel="stylesheet" href="{% static 'css/font-awesome.css' %} " media="screen" >
        <link rel="stylesheet" href="{% static ' ../maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css' %}" media="screen" >
        <link rel="stylesheet" href="{% static 'css/animate-css/animate.min.css' %}" media="screen" >
        <link rel="stylesheet" href="{% static 'css/lobipanel/lobipanel.min.css' %}" media="screen" >
        <link rel="stylesheet" href="{% static 'css/hover.css' %}" media="screen" >
        <link rel="stylesheet" href="{% static 'css/hover-demo.css' %}" media="screen" >
        <link rel="stylesheet" href="{% static 'css/prism/prism.css' %}" media="screen" >
        <link rel="stylesheet" href="{% static 'css/main.css' %}" media="screen" >
        <link href="{% static 'https://fonts.googleapis.com/icon?family=Material+Icons' %}" rel="stylesheet">
        <script src="{% static 'js/modernizr/modernizr.min.js' %}"></script>
        <script src="{% static 'https://kit.fontawesome.com/a076d05399.js' %}" crossorigin='anonymous'></script>   
        <script src="{% static 'jquery-3.6.4.min.js' %}"></script>
        <style>
            html, body {
                height: 100%;
            }
            body {
                min-height: 100vh;
                height: 100%;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background:
                    radial-gradient(circle at top, rgba(0, 123, 255, 0.28), transparent 30%),
                    linear-gradient(180deg, #020817, #030712 38%, #010409);
            }
            .login-card {
                background: rgba(2, 6, 23, 0.88);
                border: 1px solid rgba(148, 163, 184, 0.18);
                border-radius: 1.25rem;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(6px);
            }
            .login-card .form-control {
                background: rgba(255, 255, 255, 0.92);
                border: 1px solid rgba(148, 163, 184, 0.35);
                color: #020617;
            }
            .login-card .form-control::placeholder {
                color: #64748b;
            }
            .brand-badge {
                width: 42px;
                height: 42px;
                border-radius: 999px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #0d6efd, #22c55e);
                color: white;
                font-weight: 700;
            }
        </style>
        </head>
    <body class="text-light" style="height:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div class="w-100" style="max-width: 460px;">
            <div class="login-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-badge mx-auto mb-3">CB</div>
                    <p class="text-uppercase text-info small fw-bold mb-1">Secure Access</p>
                    <h1 class="h3 fw-bold mb-0">CELESEBYTE LOGIN</h1>
                    <p class="text-muted small mt-2 mb-0">Sign in to continue to your dashboard</p>
                </div>
                <form action="{% url 'login' %}" method="POST">
                    {% csrf_token %}
                    {% if error_message %}
                    <div class="alert alert-danger py-2 mb-3">{{ error_message }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="username" class="form-label">User ID</label>
                        <input type="text" class="form-control form-control-lg" name="username" id="username" placeholder="Enter your user ID" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="pass" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" name="password" id="pass" placeholder="Password" autocomplete="current-password" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="check" name="remember">
                            <label class="form-check-label small" for="check">Remember me</label>
                        </div>
                        <a href="/email" class="small text-decoration-none text-info">Forgot Password?</a>
                    </div>
                    <button type="submit" id="sign" class="btn btn-primary btn-lg w-100">
                        <i class="fa fa-sign-in-alt me-2"></i> Sign in
                    </button>
                </form>
            </div>
            <p class="text-center text-muted mt-3 small">Copyright © SaltTechno 2017</p>
        </div>
    </body>
</html>
